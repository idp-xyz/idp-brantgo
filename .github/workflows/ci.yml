name: Brant M0 / PG16 / Bento RC2
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  brant-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.12-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-only
          POSTGRES_DB: brant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: "true"
      GOPRIVATE: go.idp.xyz
      GOPROXY: direct
      GIT_TERMINAL_PROMPT: "0"
      GOTOOLCHAIN: local
      IDP_BRANT_MIGRATOR_DSN: postgres://brant_migrator:ci-migrator-only@127.0.0.1:5432/brant?sslmode=disable
      IDP_BRANT_POSTGRES_DSN: postgres://brant_app:ci-app-only@127.0.0.1:5432/brant?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - name: Resolve the immutable framework dependency
        run: |
          test "$(go list -m -f '{{.Version}}' go.idp.xyz/idp-bento-go)" = v0.1.0-rc.2
          go mod download -json go.idp.xyz/idp-bento-go@v0.1.0-rc.2 > /tmp/bento-rc2.json
          jq -e '.Sum == "h1:W9T1KsbXwuVs3lHTNwSUcEBY0Ids00hUH7I9KuBtCEo="' /tmp/bento-rc2.json
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: Go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: golangci-lint v2.15.0
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Package rules (D1-D7, AC2, AC3, AC6, AC7, AC10)
        run: go run ./tools/dependency-check
      - name: Roles (brant_migrator owns the schemas, brant_app is unprivileged)
        env:
          PGPASSWORD: ci-superuser-only
        run: >-
          psql -h 127.0.0.1 -U postgres -d brant -q -v ON_ERROR_STOP=1 -v db=brant
          -v migrator_password=ci-migrator-only -v app_password=ci-app-only -f deploy/postgres/00_roles.sql
      - name: Migrations on an empty database (operator-only tool)
        run: go run ./cmd/brant-migrate -apply
      - name: Migrations are idempotent
        run: go run ./cmd/brant-migrate -apply | tee /tmp/second-run.txt && grep -q '^DONE: 0 applied' /tmp/second-run.txt
      - name: Application grants
        env:
          PGPASSWORD: ci-migrator-only
        run: psql -h 127.0.0.1 -U brant_migrator -d brant -q -v ON_ERROR_STOP=1 -f deploy/postgres/10_app_grants.sql
      - name: Unit and PostgreSQL 16 integration tests (database tests never skip in CI)
        run: go test -tags integration -count=1 -v ./...
      - name: Race detector
        run: go test -tags integration -race -count=1 ./...
      - name: Consistency spike report (ADR-BR-004, ADR-BR-011)
        run: |
          BRANT_SPIKE_REPORT="$RUNNER_TEMP/spike-consistency.json" go test -tags integration -count=1 ./tools/spikes/consistency
          cat "$RUNNER_TEMP/spike-consistency.json"
