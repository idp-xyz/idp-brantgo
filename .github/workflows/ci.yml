name: Brant M0 / PG16 / Bento RC2
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash # -eo pipefail
env:
  CI: "true" # a missing database fails a test, never skips it
  GOPRIVATE: go.idp.xyz
  GOPROXY: direct
  GIT_TERMINAL_PROMPT: "0"
  GOTOOLCHAIN: local

# main requires the check brant-ci: the last job, which passes only when every other job passed.
# internal/bootstrap holds almost all of the suite's time; tools/testshard splits it into shards, and
# every shard runs as a job of its own, plain and with the race detector, each with its own
# PostgreSQL 16 (scripts/test-shards.sh, as make integration/race SHARDS=N run them locally). The
# number of shards is the length of a matrix's shard list (strategy.job-total): change the list, and
# only the list.
jobs:
  static:
    name: static (modules, formatting, vet, lint, package rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Resolve the immutable framework dependency
        run: |
          test "$(go list -m -f '{{.Version}}' go.idp.xyz/idp-bento-go)" = v0.1.0-rc.2
          go mod download -json go.idp.xyz/idp-bento-go@v0.1.0-rc.2 > /tmp/bento-rc2.json
          jq -e '.Sum == "h1:W9T1KsbXwuVs3lHTNwSUcEBY0Ids00hUH7I9KuBtCEo="' /tmp/bento-rc2.json
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal tools tests)"
      - name: Go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: golangci-lint v2.15.0
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Package rules (D1-D7, AC2, AC3, AC6, AC7, AC10)
        run: go run ./tools/dependency-check

  bootstrap:
    name: bootstrap ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16.12-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-only
          POSTGRES_DB: brant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IDP_BRANT_MIGRATOR_DSN: postgres://brant_migrator:ci-migrator-only@127.0.0.1:5432/brant?sslmode=disable
      IDP_BRANT_POSTGRES_DSN: postgres://brant_app:ci-app-only@127.0.0.1:5432/brant?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Roles, migrations on an empty database (twice, the second applies nothing), grants
        env:
          BRANT_PG_CONTAINER: ${{ job.services.postgres.id }}
          BRANT_PG_PORT: "5432"
          BRANT_PG_SUPERUSER_PASSWORD: ci-superuser-only
          BRANT_PG_MIGRATOR_PASSWORD: ci-migrator-only
          BRANT_PG_APP_PASSWORD: ci-app-only
        run: scripts/pg-prepare.sh
      - name: internal/bootstrap shard ${{ matrix.shard }} of ${{ strategy.job-total }}, every test passed once (database tests never skip in CI)
        run: |
          test "${{ matrix.shard }}" -eq "$(( ${{ strategy.job-index }} + 1 ))" # the list is 1..N
          scripts/test-shards.sh shard integration "${{ matrix.shard }}" "${{ strategy.job-total }}"

  bootstrap-race:
    name: bootstrap race ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16.12-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-only
          POSTGRES_DB: brant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IDP_BRANT_MIGRATOR_DSN: postgres://brant_migrator:ci-migrator-only@127.0.0.1:5432/brant?sslmode=disable
      IDP_BRANT_POSTGRES_DSN: postgres://brant_app:ci-app-only@127.0.0.1:5432/brant?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Roles, migrations on an empty database (twice, the second applies nothing), grants
        env:
          BRANT_PG_CONTAINER: ${{ job.services.postgres.id }}
          BRANT_PG_PORT: "5432"
          BRANT_PG_SUPERUSER_PASSWORD: ci-superuser-only
          BRANT_PG_MIGRATOR_PASSWORD: ci-migrator-only
          BRANT_PG_APP_PASSWORD: ci-app-only
        run: scripts/pg-prepare.sh
      - name: internal/bootstrap shard ${{ matrix.shard }} of ${{ strategy.job-total }} with the race detector, every test passed once
        run: |
          test "${{ matrix.shard }}" -eq "$(( ${{ strategy.job-index }} + 1 ))" # the list is 1..N
          scripts/test-shards.sh shard race "${{ matrix.shard }}" "${{ strategy.job-total }}"

  others:
    name: other packages (load smoke, consistency spikes)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16.12-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-only
          POSTGRES_DB: brant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IDP_BRANT_MIGRATOR_DSN: postgres://brant_migrator:ci-migrator-only@127.0.0.1:5432/brant?sslmode=disable
      IDP_BRANT_POSTGRES_DSN: postgres://brant_app:ci-app-only@127.0.0.1:5432/brant?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Roles, migrations on an empty database (twice, the second applies nothing), grants
        env:
          BRANT_PG_CONTAINER: ${{ job.services.postgres.id }}
          BRANT_PG_PORT: "5432"
          BRANT_PG_SUPERUSER_PASSWORD: ci-superuser-only
          BRANT_PG_MIGRATOR_PASSWORD: ci-migrator-only
          BRANT_PG_APP_PASSWORD: ci-app-only
        run: scripts/pg-prepare.sh
      - name: Unit and PostgreSQL 16 integration tests of every package but internal/bootstrap (database tests never skip in CI)
        run: scripts/test-shards.sh others integration
      - name: Race detector
        run: scripts/test-shards.sh others race
      - name: Consistency spike report (ADR-BR-004, ADR-BR-011)
        run: |
          BRANT_SPIKE_REPORT="$RUNNER_TEMP/spike-consistency.json" go test -tags integration -count=1 ./tools/spikes/consistency
          cat "$RUNNER_TEMP/spike-consistency.json"

  # The required check. It runs whatever happened to the jobs it needs, and fails unless every one of
  # them succeeded (a matrix succeeds only when all its shards did). Every other job of this workflow
  # belongs in needs.
  brant-ci:
    if: always()
    needs: [static, bootstrap, bootstrap-race, others]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
